title = "Custom gitleaks config for cloudydad-data-center"

[allowlist]
description = "global allow lists for this repository"
paths = [
    "clusters/.*/sealed-.*\\.yaml",
    "\\.env\\.sample"
]
regexes = [
    # Allow Prometheus recording rules with specific naming patterns
    '''apiserver_request_total:increase[0-9]+[hdm]_optimized''',
    '''apiserver_request_sli_duration_seconds_bucket:increase[0-9]+[hdm]_optimized''',
    # Allow common monitoring patterns
    '''increase[0-9]+[hdm]_optimized''',
    # Allow documentation references
    '''nix-secrets\\.md''',
    # Allow common configuration patterns (m prefix for config values)
    '''m[a-zA-Z0-9_-]+''',
    # Allow Kubernetes and Helm patterns
    '''configMapKeyRef.*m[A-Za-z_-]+''',
    '''key:.*m[A-Za-z_-]+''',
    # Allow SSH key type patterns
    '''ecdsa-sha2-nistp256''',
    # Allow feature flags and configuration
    '''feature-gates.*''',
    # Allow example/placeholder values
    '''myour-.*''',
    # Allow alertmanager config references
    '''malertmanager-config''',
]

[[rules]]
id = "generic-api-key"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passwd|password|secret|token)(?:[ \t\w.-]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([\w.=-]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
entropy = 3.5
keywords = [
    "access",
    "api",
    "auth",
    "key",
    "credential",
    "creds",
    "passwd",
    "password",
    "secret",
    "token",
]
[rules.allowlist]
regexTarget = "match"
regexes = [
    '''(?i)(accessor|access[_.-]?id|api[_.-]?(version|id)|rapid|capital|[a-z0-9-]*?api[a-z0-9-]*?:jar:|author|X-MS-Exchange-Organization-Auth|Authentication-Results|(credentials?[_.-]?id|withCredentials)|(bucket|foreign|hot|natural|primary|schema|sequence)[_.-]?key|key[_.-]?(alias|board|code|ring|stone|storetype|word|up|down|left|right)|key(store|tab)[_.-]?(file|path)|issuerkeyhash|(?-i:[DdMm]onkey|[DM]ONKEY)|keying|(secret)[_.-]?name|UserSecretsId|(api|credentials|token)[_.-]?(endpoint|ur[il])|public[_.-]?(key|token)|(key|token)[_.-]?file)''',
    '''apiserver_request_total.*optimized''',
    '''increase[0-9]+[hdm]_optimized''',
    # Additional patterns for this repository
    '''m[a-zA-Z0-9_-]+''',
    '''configMapKeyRef.*m[A-Za-z_-]+''',
    '''key:.*m[A-Za-z_-]+''',
    '''ecdsa-sha2-nistp256.*''',
    '''feature-gates.*''',
    '''myour-.*''',
    '''malertmanager-config''',
    '''#pragma: allowlist.*''',
    '''config\.age\.secrets\.[a-zA-Z0-9_.-]+''',
    '''your-[a-zA-Z0-9_-]+''',
    '''[a-zA-Z0-9_-]+-generated-[a-zA-Z0-9_-]+''',
    '''[A-Z_]+''',
    '''[a-zA-Z0-9_-]+-auth-secret''',
    '''[a-zA-Z0-9_-]+-basic-auth''',
    '''mgrafana-credentials''',
]
