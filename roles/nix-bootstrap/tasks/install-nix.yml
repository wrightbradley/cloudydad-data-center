---
- name: Check if Nix is already installed
  ansible.builtin.stat:
    path: /nix/var/nix/profiles/default
  register: nix_installed

- name: Install Nix package manager
  when: not nix_installed.stat.exists
  block:
    - name: Install Nix prerequisites (xz-utils, curl)
      ansible.builtin.package:
        name:
          - xz-utils
          - curl
        state: present
      become: true

    - name: Download Nix installer script
      ansible.builtin.get_url:
        url: '{{ nix_install_url }}'
        dest: /tmp/nix-install.sh
        mode: '0755'
        timeout: 60

    - name: Run Nix installer (multi-user daemon mode)
      ansible.builtin.shell: |
        export TMPDIR=/var/tmp
        sh /tmp/nix-install.sh --daemon --yes
      args:
        creates: /nix/var/nix/profiles/default
      register: nix_install_result
      changed_when: nix_install_result.rc == 0

    - name: Remove installer script
      ansible.builtin.file:
        path: /tmp/nix-install.sh
        state: absent

    - name: Ensure Nix daemon is running
      ansible.builtin.systemd:
        name: nix-daemon
        state: started
        enabled: true
        daemon_reload: true

- name: Source Nix environment for current session
  ansible.builtin.lineinfile:
    path: /etc/profile.d/nix-env.sh
    line: '. /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh'
    create: true
    mode: '0644'

- name: Verify Nix installation
  ansible.builtin.shell: |
    . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
    nix --version
  args:
    executable: /bin/bash
  register: nix_version_check
  changed_when: false

- name: Display Nix version
  ansible.builtin.debug:
    msg: 'Nix installed: {{ nix_version_check.stdout }}'
