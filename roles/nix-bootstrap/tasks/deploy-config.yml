---
- name: Create Nix system configuration directory
  ansible.builtin.file:
    path: '{{ nix_system_dir }}'
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Create k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Fetch K3S_TOKEN from environment or Bitwarden
  ansible.builtin.set_fact:
    k3s_token_value: "{{ lookup('env', 'K3S_TOKEN') | default(lookup('community.general.bitwarden', '0c769bf1-4a82-4cde-876f-b1a3018171e6', search='id', field='K3S_TOKEN') | first, true) }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Verify K3S_TOKEN is available
  ansible.builtin.fail:
    msg: "K3S_TOKEN not found. Set environment variable or configure Bitwarden access."
  when: k3s_token_value is not defined or k3s_token_value | length == 0
  delegate_to: localhost
  run_once: true

- name: Deploy k3s token file
  ansible.builtin.copy:
    content: '{{ k3s_token_value }}'
    dest: /etc/rancher/k3s/k3s-token
    mode: '0600'
    owner: root
    group: root
  no_log: true

- name: Determine k3s role based on group membership
  ansible.builtin.set_fact:
    k3s_role: "{{ 'server' if 'master' in group_names else 'agent' }}"

- name: Deploy Nix flake.nix
  ansible.builtin.template:
    src: flake.nix.j2
    dest: '{{ nix_system_dir }}/flake.nix'
    owner: root
    group: root
    mode: '0644'
  register: flake_deployed

- name: Deploy Nix configuration.nix
  ansible.builtin.template:
    src: configuration.nix.j2
    dest: '{{ nix_config_file }}'
    owner: root
    group: root
    mode: '0644'
  register: config_deployed

- name: Create .gitignore for Nix system directory
  ansible.builtin.copy:
    content: |
      result
      .direnv
      age.key
    dest: '{{ nix_system_dir }}/.gitignore'
    mode: '0644'
    owner: root
    group: root
