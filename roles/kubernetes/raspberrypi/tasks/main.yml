---
- name: Check if system is a Raspberry Pi via device-tree
  ansible.builtin.stat:
    path: /proc/device-tree/model
  register: device_tree_model_file

- name: Read Raspberry Pi model from device-tree
  ansible.builtin.slurp:
    src: /proc/device-tree/model
  register: device_tree_model
  when: device_tree_model_file.stat.exists

- name: Check if system is a Raspberry Pi via cpuinfo
  ansible.builtin.command: grep -E "Raspberry Pi|BCM2708|BCM2709|BCM2835|BCM2836|BCM2837|BCM2711|BCM2712" /proc/cpuinfo
  register: cpuinfo_raspberrypi
  failed_when: false
  changed_when: false

- name: Set raspberry_pi fact based on detection
  ansible.builtin.set_fact:
    raspberry_pi: true
    raspberry_pi_model: >-
      {% if device_tree_model is defined and device_tree_model.content is defined %}
        {{ device_tree_model.content | b64decode | trim }}
      {% else %}
        Raspberry Pi (Unknown Model)
      {% endif %}
  when: >
    (device_tree_model is defined and device_tree_model.content is defined and
     'Raspberry Pi' in (device_tree_model.content | b64decode)) or
    cpuinfo_raspberrypi.rc == 0

- name: Debug Raspberry Pi detection
  ansible.builtin.debug:
    msg: "Detected {{ raspberry_pi_model | default('No Raspberry Pi') }}"
  when: raspberry_pi | default(false)

- name: Set detected_distribution to Raspbian
  ansible.builtin.set_fact:
    detected_distribution: Raspbian
  when:
    - raspberry_pi | default(false)
    - ansible_facts.architecture is search('aarch64')
    - ansible_facts.lsb.description | default('') is match('[Rr]aspbian.*|Debian.*(buster|bullseye|bookworm|trixie)')

- name: Set detected_distribution_major_version
  ansible.builtin.set_fact:
    detected_distribution_major_version: "{{ ansible_facts.lsb.major_release }}"
  when:
    - detected_distribution | default('') == 'Raspbian'

- name: Execute OS related tasks on the Raspberry Pi
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "setup/{{ detected_distribution }}-{{ detected_distribution_major_version }}.yml"
    - "setup/{{ detected_distribution }}.yml"
    - "setup/{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - "setup/{{ ansible_distribution }}.yml"
    - "setup/default.yml"
  vars:
    action_: "{% if state == 'present' %}setup{% else %}teardown{% endif %}"
  when: raspberry_pi | default(false)
