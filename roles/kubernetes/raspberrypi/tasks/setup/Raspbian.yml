---
- name: Test for cmdline path
  ansible.builtin.stat:
    path: /boot/firmware/cmdline.txt
  register: boot_cmdline_path
  failed_when: false
  changed_when: false

- name: Set cmdline path based on Debian version and command result
  ansible.builtin.set_fact:
    cmdline_path: >-
      {{
        (
          boot_cmdline_path.stat.exists and
          ansible_facts.lsb.description | default('') is match('Debian.*(?!(bookworm|sid))')
        ) | ternary(
          '/boot/firmware/cmdline.txt',
          '/boot/cmdline.txt'
        )
      }}

- name: Read current cmdline content
  ansible.builtin.slurp:
    src: "{{ cmdline_path }}"
  register: cmdline_content
  changed_when: false

- name: Remove cgroup_disable parameter from cmdline
  ansible.builtin.replace:
    path: "{{ cmdline_path }}"
    regexp: '\s*cgroup_disable=\w+'
    replace: ''
  notify: reboot
  when: "'cgroup_disable=' in cmdline_content.content | b64decode"

- name: Activating cgroup support
  ansible.builtin.replace:
    path: "{{ cmdline_path }}"
    regexp: '^(.*)$'
    replace: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
  notify: reboot
  when: "'cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory' not in cmdline_content.content | b64decode"

- name: Install iptables
  ansible.builtin.apt:
    name: iptables
    state: present

- name: Flush iptables before changing to iptables-legacy
  ansible.builtin.iptables:
    flush: true

- name: Changing to iptables-legacy
  community.general.alternatives:
    path: /usr/sbin/iptables-legacy
    name: iptables
  register: ip4_legacy

- name: Changing to ip6tables-legacy
  community.general.alternatives:
    path: /usr/sbin/ip6tables-legacy
    name: ip6tables
  register: ip6_legacy
