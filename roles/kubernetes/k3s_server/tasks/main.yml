---
- name: Check if k3s is already properly configured
  ansible.builtin.stat:
    path: /etc/rancher/k3s/k3s.yaml
  register: k3s_config

- name: Check if k3s service is running
  ansible.builtin.systemd:
    name: k3s
  register: k3s_service_status

- name: Check if node is already part of cluster
  ansible.builtin.command: k3s kubectl get nodes -o=jsonpath='{.items[?(@.metadata.name=="{{ ansible_hostname }}")].metadata.name}'
  register: node_in_cluster
  changed_when: false
  failed_when: false
  when: k3s_config.stat.exists and k3s_service_status.status.ActiveState == "active"

- name: Stop k3s-init
  ansible.builtin.systemd:
    name: k3s-init
    state: stopped
  failed_when: false
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

# k3s-init won't work if the port is already in use
- name: Stop k3s
  ansible.builtin.systemd:
    name: k3s
    state: stopped
  failed_when: false
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

- name: Clean previous runs of k3s-init # noqa command-instead-of-module
  # The systemd module does not support "reset-failed", so we need to resort to command.
  ansible.builtin.command: systemctl reset-failed k3s-init
  failed_when: false
  changed_when: false
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

- name: Deploy K3s http_proxy conf
  ansible.builtin.include_tasks: http_proxy.yml
  when: proxy_env is defined

- name: Deploy vip manifest
  ansible.builtin.include_tasks: vip.yml
- name: Deploy metallb manifest
  ansible.builtin.include_tasks: metallb.yml
  tags: metallb
  when: kube_vip_lb_ip_range is not defined and (not cilium_bgp or cilium_iface is not defined)

- name: Deploy kube-vip manifest
  ansible.builtin.include_tasks: kube-vip.yml
  tags: kubevip
  when: kube_vip_lb_ip_range is defined

- name: Init cluster inside the transient k3s-init service
  ansible.builtin.command:
    cmd: systemd-run -p RestartSec=2 -p Restart=on-failure --unit=k3s-init k3s server {{ server_init_args }}
    creates: '{{ systemd_dir }}/k3s-init.service'
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

- name: Verification
  when: false and not ansible_check_mode
  block:
    - name: Verify that all nodes actually joined (check k3s-init.service if this fails)
      ansible.builtin.command:
        cmd: "{{ k3s_kubectl_binary | default('k3s kubectl') }} get nodes -l 'node-role.kubernetes.io/master=true' -o=jsonpath='{.items[*].metadata.name}'" # yamllint disable-line rule:line-length
      register: nodes
      until: nodes.rc == 0 and (nodes.stdout.split() | length) == (groups[group_name_master | default('master')] | length) # yamllint disable-line rule:line-length
      retries: '{{ retry_count | default(20) }}'
      delay: 10
      changed_when: false
  always:
    - name: Save logs of k3s-init.service
      ansible.builtin.include_tasks: fetch_k3s_init_logs.yml
      when: log_destination
      vars:
        log_destination: >-
          {{ lookup('ansible.builtin.env', 'ANSIBLE_K3S_LOG_DIR', default=False) }}
    - name: Kill the temporary service used for initialization
      ansible.builtin.systemd:
        name: k3s-init
        state: stopped
      failed_when: false

- name: Copy K3s service file
  register: k3s_service_template
  ansible.builtin.template:
    src: k3s.service.j2
    dest: '{{ systemd_dir }}/k3s.service'
    owner: root
    group: root
    mode: '0644'
  tags: k3s-service
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

- name: Check if service file needs update
  ansible.builtin.command: diff '{{ systemd_dir }}/k3s.service' '{{ systemd_dir }}/k3s.service.expected'
  register: service_diff
  changed_when: service_diff.rc != 0
  failed_when: false
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname

- name: Update K3s service file if needed
  ansible.builtin.template:
    src: k3s.service.j2
    dest: '{{ systemd_dir }}/k3s.service'
    owner: root
    group: root
    mode: '0644'
  tags: k3s-service
  when: service_diff.rc is defined and service_diff.rc != 0
  register: k3s_service_update

- name: Enable and check K3s service
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: started
    enabled: true
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname) or (k3s_service_update is defined and k3s_service_update.changed)

- name: Ensure K3s service is running (no restart)
  ansible.builtin.systemd:
    name: k3s
    enabled: true
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname and (k3s_service_update is not defined or not k3s_service_update.changed)

- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
  when: not (k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname)

- name: Check ETCD certificates validity for existing nodes
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/tls/etcd/server-ca.crt
  register: etcd_ca_cert
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname

- name: Validate ETCD certificate expiration for existing nodes
  ansible.builtin.shell: set -o pipefail && openssl x509 -in /var/lib/rancher/k3s/server/tls/etcd/server-ca.crt -noout -enddate 2>/dev/null | cut -d= -f2
  register: etcd_cert_expiry
  changed_when: false
  failed_when: false
  when: etcd_ca_cert.stat is defined and etcd_ca_cert.stat.exists

- name: Parse ETCD certificate expiry date
  ansible.builtin.shell: |
    CERT_DATE="{{ etcd_cert_expiry.stdout }}"
    CURRENT_EPOCH=$(date +%s)
    CERT_EPOCH=$(date -d "${CERT_DATE}" +%s 2>/dev/null || date -d "${CERT_DATE} GMT" +%s 2>/dev/null)
    echo $(( (CERT_EPOCH - CURRENT_EPOCH) / 86400 ))
  register: etcd_cert_days_remaining
  changed_when: false
  failed_when: false
  when: etcd_cert_expiry.stdout is defined

- name: Warn about expiring ETCD certificates
  ansible.builtin.debug:
    msg: |
      WARNING: ETCD certificate on {{ ansible_hostname }} expires on {{ etcd_cert_expiry.stdout }} ({{ (etcd_cert_days_remaining.stdout | trim) }} days)
      Consider rotating certificates soon!
  when: etcd_cert_days_remaining.stdout is defined and (etcd_cert_days_remaining.stdout | trim | int) < 30

- name: Verify cluster health for existing nodes
  ansible.builtin.command: k3s kubectl get endpoints kubernetes -n default -o=jsonpath='{.subsets[0].addresses[*].ip}'
  register: cluster_endpoints
  changed_when: false
  failed_when: false
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname

- name: Check ETCD health for existing nodes
  ansible.builtin.shell: |
    k3s etcd-snapshot info --data-dir /var/lib/rancher/k3s/server/db/etcd 2>/dev/null || echo "ETCD not ready"
  register: etcd_health
  changed_when: false
  failed_when: false
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname

- name: Log cluster status for existing nodes
  ansible.builtin.debug:
    msg: |
      Node {{ ansible_hostname }} is already part of cluster
      Cluster endpoints: {{ cluster_endpoints.stdout | default('Not accessible') }}
      ETCD status: {{ etcd_health.stdout | default('Not ready') }}
  when: k3s_config.stat.exists and node_in_cluster.stdout is defined and node_in_cluster.stdout == ansible_hostname

- name: Register node-token file access mode
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server
  register: p

- name: Change file access node-token
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server
    mode: g+rx,o+rx

- name: Read node-token from master
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token

- name: Store Master node-token
  ansible.builtin.set_fact:
    token: "{{ node_token.content | b64decode | regex_replace('\n', '') }}"

- name: Restore node-token file access
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server
    mode: '{{ p.stat.mode }}'

- name: Create directory .kube
  ansible.builtin.file:
    path: '{{ ansible_user_dir }}/.kube'
    state: directory
    owner: '{{ ansible_user_id }}'
    mode: u=rwx,g=rx,o=

- name: Copy config file to user home directory
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: '{{ ansible_user_dir }}/.kube/config'
    remote_src: true
    owner: '{{ ansible_user_id }}'
    mode: u=rw,g=,o=

- name: Configure kubectl cluster to {{ endpoint_url }}
  ansible.builtin.command: >-
    {{ k3s_kubectl_binary | default('k3s kubectl') }} config set-cluster default
      --server={{ endpoint_url }}
      --kubeconfig {{ ansible_user_dir }}/.kube/config
  changed_when: true
  vars:
    endpoint_url: >-
      https://{{ apiserver_endpoint | ansible.utils.ipwrap }}:6443
# Deactivated linter rules:
#   - jinja[invalid]: As of version 6.6.0, ansible-lint complains that the input to ipwrap
#                     would be undefined. This will not be the case during playbook execution.
# noqa jinja[invalid]

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
  when: k3s_create_kubectl_symlink | default(true) | bool

- name: Create crictl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/crictl
    state: link
  when: k3s_create_crictl_symlink | default(true) | bool

- name: Get contents of manifests folder
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/server/manifests
    file_type: file
  register: k3s_server_manifests

- name: Get sub dirs of manifests folder
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/server/manifests
    file_type: directory
  register: k3s_server_manifests_directories

- name: Remove manifests and folders that are only needed for bootstrapping cluster so k3s doesn't auto apply on start
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  with_items:
    - '{{ k3s_server_manifests.files }}'
    - '{{ k3s_server_manifests_directories.files }}'
  loop_control:
    label: '{{ item.path }}'
