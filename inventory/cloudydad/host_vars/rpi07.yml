---
# rpi07 - Raspberry Pi 4 (8GB RAM)
flannel_iface: eth0
k3s_master_taint: true

# Resource allocations for Pi 4 (8GB RAM)
kubelet_system_reserved: cpu=300m,memory=768Mi,ephemeral-storage=2Gi
kubelet_kube_reserved: cpu=300m,memory=768Mi,ephemeral-storage=1Gi
kubelet_eviction_hard: memory.available<512Mi,nodefs.available<15%
