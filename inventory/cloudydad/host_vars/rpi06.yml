---
# rpi06 - Raspberry Pi 4 (4GB RAM)
# Role: k3s master node (added 2026-02-15 as third master for HA)
# etcd member ID: 7cbc0fb8a681907e

# Use eth0 for k3s networking
flannel_iface: eth0

# Master node should not schedule regular workloads
k3s_master_taint: true

# Resource allocations for Pi 4 (4GB RAM)
# These match the actual deployed config in /etc/rancher/k3s/config.yaml
kubelet_system_reserved: cpu=200m,memory=512Mi,ephemeral-storage=3Gi
kubelet_kube_reserved: cpu=150m,memory=384Mi,ephemeral-storage=2Gi
kubelet_eviction_hard: memory.available<384Mi,nodefs.available<15%
