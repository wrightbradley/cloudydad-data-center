---
# mini - Mac Mini (x86_64, 16GB RAM)
flannel_iface: enp1s0f0

# Resource allocations for 16GB RAM
kubelet_system_reserved: cpu=1000m,memory=1Gi,ephemeral-storage=10Gi
kubelet_kube_reserved: cpu=1000m,memory=1Gi,ephemeral-storage=5Gi
kubelet_eviction_hard: memory.available<1Gi,nodefs.available<10%

# Additional kubelet args for better performance
kubelet_extra_args: >-
  --kubelet-arg eviction-soft="memory.available<1.5Gi,nodefs.available<15%" --kubelet-arg eviction-soft-grace-period="memory.available=1m,nodefs.available=2m" --kubelet-arg eviction-max-pod-grace-period=30 --kubelet-arg kube-api-qps=50 --kubelet-arg kube-api-burst=100
