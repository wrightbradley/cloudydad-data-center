---
# rpi05 - Raspberry Pi 3B+ (constrained hardware)
flannel_iface: eth0
k3s_master_taint: true

# Resource allocations for constrained hardware (1GB RAM)
kubelet_system_reserved: cpu=100m,memory=128Mi,ephemeral-storage=1Gi
kubelet_kube_reserved: cpu=100m,memory=128Mi,ephemeral-storage=512Mi
kubelet_eviction_hard: memory.available<128Mi,nodefs.available<10%

# Node labels
k3s_node_labels:
  - exclude-storage=true
