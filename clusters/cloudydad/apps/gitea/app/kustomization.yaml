---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitea
resources:
  - ./gitea-namespace.yaml
  - ./sealed-gitea-secrets.yaml
  - ./gitea-helm-release.yaml
  - ./gitea-certificate.yaml
  - ./gitea-ingressroute-tcp.yaml
  - ./github-archive
configMapGenerator:
  - name: gitea-values
    files:
      - values.yaml=gitea-values.yaml
configurations:
  - kustomizeconfig.yaml
