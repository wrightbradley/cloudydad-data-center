---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-archiver
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-archiver
  namespace: gitea
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list']
    resourceNames:
      - github-repos-to-archive
      - github-archiver-script
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-archiver
  namespace: gitea
subjects:
  - kind: ServiceAccount
    name: github-archiver
    namespace: gitea
roleRef:
  kind: Role
  name: github-archiver
  apiGroup: rbac.authorization.k8s.io
