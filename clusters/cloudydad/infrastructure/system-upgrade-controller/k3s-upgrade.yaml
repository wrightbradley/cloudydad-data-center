---
# These plans are adapted from work by Dax McDonald (https://github.com/daxmc99) and Hussein Galal (https://github.com/galal-hussein)
# in support of Rancher v2 managed k3s upgrades. See Also: https://rancher.com/docs/k3s/latest/en/upgrades/automated/
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    k3s-upgrade: server
spec:
  concurrency: 1
  exclusive: true
  jobActiveDeadlineSecs: 900
  postCompleteDelay: 30s
  priorityClassName: system-node-critical
  channel: https://update.k3s.io/v1-release/channels/v1.32
  nodeSelector:
    matchExpressions:
      - {key: node.kubernetes.io/instance-type, operator: In, values: ["k3s"]}
      - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      - {key: k3s-upgrade, operator: Exists}
      - {key: k3s-upgrade, operator: NotIn, values: ["disabled", "false"]}
      - {key: k3os.io/mode, operator: DoesNotExist}
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/controlplane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/etcd"
      operator: "Exists"
      effect: "NoExecute"
  serviceAccountName: system-upgrade
  cordon: true
  drain:
    force: true
    disableEviction: false
    skipWaitForDeleteTimeout: 300
    ignoreDaemonSets: true
    deleteEmptydirData: true
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  concurrency: 1
  exclusive: true
  jobActiveDeadlineSecs: 900
  postCompleteDelay: 30s
  priorityClassName: system-node-critical
  channel: https://update.k3s.io/v1-release/channels/v1.32
  nodeSelector:
    matchExpressions:
      - {key: node.kubernetes.io/instance-type, operator: In, values: ["k3s"]}
      - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      - {key: k3s-upgrade, operator: Exists}
      - {key: k3s-upgrade, operator: NotIn, values: ["disabled", "false"]}
      - {key: k3os.io/mode, operator: DoesNotExist}
  serviceAccountName: system-upgrade
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/controlplane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/etcd"
      operator: "Exists"
      effect: "NoExecute"
  prepare:
    # Defaults to the same "resolved" tag that is used for the `upgrade` container, NOT `latest`
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  drain:
    force: true
    disableEviction: false # Respect PDBs and use graceful eviction
    skipWaitForDeleteTimeout: 300 # Extended from 60s to 300s (5 minutes) to honor PDBs
    ignoreDaemonSets: true # Don't wait for daemonset pods
    deleteEmptydirData: true # Allow deletion of pods with emptyDir volumes
  upgrade:
    image: rancher/k3s-upgrade
