---
# System Upgrade Controller Application - K3s Node Upgrades
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://rancher.github.io/system-charts
    chart: system-upgrade-controller
    targetRevision: 0.13.0
    helm:
      valuesFiles:
        - clusters/cloudydad/infrastructure/system-upgrade-controller/app/system-upgrade-controller-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
