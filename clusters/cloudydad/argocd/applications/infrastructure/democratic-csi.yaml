---
# democratic-csi Application - TrueNAS iSCSI Storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://democratic-csi.github.io/democratic-csi
    chart: democratic-csi
    targetRevision: 0.15.0
    helm:
      valuesFiles:
        - clusters/cloudydad/infrastructure/storage/democratic-csi/app/truenas-api-iscsi-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
