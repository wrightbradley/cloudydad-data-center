---
# Victoria Metrics K8s Stack Application - Monitoring
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-k8s-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.33.2
    helm:
      valuesFiles:
        - clusters/cloudydad/observability/vm-k8s-stack/app/vm-k8s-stack-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vm-k8s-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
