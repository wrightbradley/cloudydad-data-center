---
# Karakeep Application - Bookmarking
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karakeep
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://charts.karakeep.io
    chart: karakeep
    targetRevision: 0.1.0
    helm:
      valuesFiles:
        - clusters/cloudydad/apps/karakeep/app/karakeep-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: karakeep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
